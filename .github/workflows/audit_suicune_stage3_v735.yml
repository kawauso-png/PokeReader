name: Suicune Stage3 v7.3.5 Full Generated Audit

on:
  push:
    branches:
      - suicune-stage3-v735-full-audit
  workflow_dispatch:

jobs:
  audit:
    name: Rebuild v7.3.4 and export generated sources
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - run: sh apply_suicune_deterministic_v37.sh
      - run: sh apply_suicune_observe_v38.sh
      - run: sh apply_suicune_observe_v38_post.sh
      - run: python3 apply_suicune_endpoint_v41.py
      - run: python3 apply_suicune_endpoint_v42_lighttail.py
      - run: python3 apply_suicune_endpoint_v44_puretail.py
      - run: python3 apply_suicune_endpoint_v44_routecount.py
      - run: python3 apply_suicune_start_signature_v48.py
      - run: python3 apply_suicune_resume_phase_lock_v49.py
      - run: python3 fix_suicune_start_phase_v50_patch.py
      - run: python3 apply_suicune_start_phase_lock_v50.py
      - run: python3 fix_suicune_vblank_context_v52_patch.py
      - run: python3 apply_suicune_vblank_context_v52.py
      - run: python3 apply_suicune_vblank_context_freeze_v52.py
      - run: python3 apply_suicune_vblank_context_v53.py
      - run: python3 apply_suicune_startsig_preserve_v54.py
      - run: python3 fix_suicune_early_control_lab_v55_patch.py
      - run: python3 fix_suicune_early_control_lab_v55_patch2.py
      - run: python3 fix_suicune_early_control_lab_v55_patch3.py
      - run: python3 fix_suicune_early_control_lab_v55_patch4.py
      - run: python3 apply_suicune_early_control_lab_v55.py
      - run: python3 apply_suicune_early_profile_v56.py
      - run: python3 apply_suicune_early_mapper_v57.py
      - run: python3 apply_suicune_early_adaptive_v58.py
      - run: python3 apply_suicune_live_phase_core_v60.py
      - run: python3 apply_suicune_neutral_delay_v61.py
      - run: python3 apply_suicune_neutral_delay_v61b.py
      - run: python3 apply_suicune_neutral_delay_v61c.py
      - run: python3 apply_suicune_prefingerprint_v62.py
      - run: python3 apply_suicune_postfingerprint_v63.py
      - run: python3 apply_suicune_practical_shiny_v64.py
      - run: python3 apply_suicune_post_adaptive_v65.py
      - run: python3 apply_suicune_cadence_autophase_v653.py
      - run: python3 apply_suicune_target_revalidate_v654.py
      - run: python3 apply_suicune_vc_reset_loop_v656.py
      - run: python3 apply_suicune_fast_validate_v658.py
      - name: Capture historical successful UP+B controller
        run: cp 3gx/sources/main.c main_v658.c
      - run: python3 apply_suicune_branch_trial_v660.py
      - run: python3 apply_suicune_status_epoch_v661.py
      - run: python3 apply_suicune_transport_stable_v670.py
      - run: python3 apply_suicune_rolling_reroot_v671.py
      - run: python3 apply_suicune_live_root_scan_v680.py
      - run: python3 apply_suicune_branch_aware_live_v690.py
      - run: python3 apply_suicune_exact_index_live_v700.py
      - run: python3 apply_suicune_stage3_v710.py
      - name: Decode actual v7.1 empirical donor metadata
        run: python3 audit_decode_v710_payload.py > decoded_v710.json
      - run: python3 apply_suicune_overlay_compact_v711.py
      - run: python3 apply_suicune_actionable_counter_v712.py
      - run: python3 apply_suicune_crossbranch_v713.py
      - run: python3 fix_suicune_v713_lane_fields.py
      - run: python3 apply_suicune_postbeam_v720.py
      - run: python3 apply_suicune_globalbeam_v730.py
      - run: python3 apply_suicune_softreset_fresh_v731.py
      - run: python3 fix_suicune_v731_rearm_gate.py
      - run: python3 fix_suicune_v732_reset_baseline.py
      - run: python3 fix_suicune_v733_host_exact_reset.py
      - run: python3 fix_suicune_v734_upb_robust.py
      - name: Generated-source audit and historical diff
        run: |
          grep -nE 'void handle_freeze|scan_input\(|get_current_keys|KEY_B|KEY_DUP|fixed_run_pending|fixed_frames_remaining|suicune_auto_resume_pending|host_request_resume|arm_suicune_probe|search_suicune' 3gx/sources/main.c > generated_main_keypaths.txt || true
          grep -nE 'practical_wait_monitor|rebind_shiny_post|practical_expected40|practical_expected716|practical_expected717|soft_reset|RESET WAIT|arm_suicune_probe|candidate_valid' reader_core/src/crystal/trace.rs > generated_trace_keypaths.txt || true
          grep -nE '^static|^u32 host_|^void host_' 3gx/sources/main.c > generated_main_mutable_state.txt || true
          diff -u main_v658.c 3gx/sources/main.c > main_v658_vs_v734.diff || true
          sha256sum main_v658.c 3gx/sources/main.c reader_core/src/crystal/trace.rs reader_core/src/crystal/practical.rs reader_core/src/crystal/hook.rs > generated_sources.sha256
      - name: Build generated source
        run: make
      - name: Export generated sources and binary
        uses: actions/upload-artifact@v4
        with:
          name: Suicune-v735-Historical-Diff-and-Bank
          path: |
            main_v658.c
            main_v658_vs_v734.diff
            decoded_v710.json
            3gx/sources/main.c
            3gx/sources/hid.c
            3gx/sources/pnp.c
            3gx/includes/pokereader.h
            3gx/includes/pnp.h
            reader_core/src/crystal/trace.rs
            reader_core/src/crystal/practical.rs
            reader_core/src/crystal/hook.rs
            reader_core/src/pnp/input.rs
            reader_core/src/pnp/bindings.rs
            generated_main_keypaths.txt
            generated_trace_keypaths.txt
            generated_main_mutable_state.txt
            generated_sources.sha256
            out/default.3gx
          retention-days: 7
