name: Crystal Boot Trace v2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - "crystal-boot-trace-v2"

jobs:
  build-boot-v2:
    name: Build Crystal Boot Trace v2
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify boot trace v2 markers
        run: |
          grep -q "BOOT_CALL_TRACE_V2" reader_core/src/crystal/boottrace.rs
          grep -q "h_joy_pressed" reader_core/src/crystal/boottrace.rs
          grep -q "CRYSTAL_HRAM_PTR" reader_core/src/crystal/boottrace.rs

      - name: Build
        run: make

      - name: Upload boot trace v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Crystal-Boot-Trace-v2
          retention-days: 7
          path: out/default.3gx
