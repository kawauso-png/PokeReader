name: Suicune Early Control Lab v5.5 Fixed Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-early-control-lab-v55"

jobs:
  build-early-control-lab-v55-fixed:
    name: Build Suicune Early Control Lab v5.5 Fixed
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh
      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh
      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh
      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py
      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py
      - name: Apply endpoint v4.4 PURETAIL
        run: python3 apply_suicune_endpoint_v44_puretail.py
      - name: Add minimal PURETAIL route counter
        run: python3 apply_suicune_endpoint_v44_routecount.py
      - name: Apply Start Signature v4.8
        run: python3 apply_suicune_start_signature_v48.py
      - name: Apply Resume Phase Lock v4.9
        run: python3 apply_suicune_resume_phase_lock_v49.py
      - name: Fix Start Phase patch match
        run: python3 fix_suicune_start_phase_v50_patch.py
      - name: Apply Start Phase Lock v5.0
        run: python3 apply_suicune_start_phase_lock_v50.py
      - name: Fix v5.2 generated import match
        run: python3 fix_suicune_vblank_context_v52_patch.py
      - name: Apply rolling VBlank Context v5.2
        run: python3 apply_suicune_vblank_context_v52.py
      - name: Freeze VBlank Context after Target
        run: python3 apply_suicune_vblank_context_freeze_v52.py
      - name: Apply scalar VBlank Context v5.3
        run: python3 apply_suicune_vblank_context_v53.py
      - name: Preserve Target Start Signature v5.4
        run: python3 apply_suicune_startsig_preserve_v54.py
      - name: Fix v5.5 generated matches
        run: python3 fix_suicune_early_control_lab_v55_patch.py
      - name: Fix v5.5 detector insertion anchor
        run: python3 fix_suicune_early_control_lab_v55_patch2.py
      - name: Use first record anchor for detector
        run: python3 fix_suicune_early_control_lab_v55_patch3.py
      - name: Apply Early Control Lab v5.5
        run: python3 apply_suicune_early_control_lab_v55.py
      - name: Verify v5.5 markers
        run: |
          grep -q "host_suicune_early_gate_request" 3gx/sources/main.c
          grep -q "suicune_early_gate_pending" 3gx/sources/main.c
          grep -q "request_suicune_early_gate" reader_core/src/pnp/input.rs
          grep -q "EARLY,V55" reader_core/src/crystal/trace.rs
          grep -q "Lab E" reader_core/src/crystal/trace.rs
          grep -q "STARTSIG,V54" reader_core/src/crystal/trace.rs
          grep -q "SPH,V50" reader_core/src/crystal/trace.rs
          grep -q "RPH,V49" reader_core/src/crystal/trace.rs
      - name: Build
        run: make
      - name: Upload Early Control Lab v5.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Early-Control-Lab-v55-fixed
          retention-days: 7
          path: out/default.3gx
