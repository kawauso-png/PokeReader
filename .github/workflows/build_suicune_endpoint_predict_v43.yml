name: Suicune Endpoint Predictor v4.3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-endpoint-predict-v43"

jobs:
  build-endpoint-predict-v43:
    name: Build Suicune Endpoint Predictor v4.3
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install endpoint patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3

      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh

      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh

      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh

      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py

      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py

      - name: Apply endpoint v4.3 predictor
        run: python3 apply_suicune_endpoint_predict_v43.py

      - name: Verify v4.3 markers
        run: |
          grep -q "EP43_FRAME_M" reader_core/src/crystal/trace.rs
          grep -q "EP43_VBLANK_A_TO_RANDOM_A" reader_core/src/crystal/trace.rs
          grep -q "EP43_ROUTE3_ITEM_TO_DV1_M" reader_core/src/crystal/trace.rs
          grep -q "EP43_ROUTE4_ITEM1_TO_ITEM2_M" reader_core/src/crystal/trace.rs
          grep -q "pred_raw" reader_core/src/crystal/trace.rs
          grep -q "EP43 +{} S{:04X}" reader_core/src/crystal/trace.rs
          grep -q "deep_log_stop();" reader_core/src/crystal/trace.rs
          grep -q "fixed_a_frames = 2;" 3gx/sources/main.c

      - name: Build
        run: make

      - name: Upload Endpoint v4.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Endpoint-Predict-v43
          retention-days: 7
          path: out/default.3gx
