name: Suicune Endpoint Predictor v4.5 PURETAIL Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-endpoint-predict-puretail-v45"

jobs:
  build-endpoint-v45:
    name: Build Suicune Endpoint Predictor v4.5 PURETAIL
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install endpoint patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3

      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh

      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh

      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh

      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py

      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py

      - name: Apply endpoint v4.4 PURETAIL
        run: python3 apply_suicune_endpoint_v44_puretail.py

      - name: Add minimal PURETAIL route counter
        run: python3 apply_suicune_endpoint_v44_routecount.py

      - name: Fix v4.5 patch targeting
        run: python3 fix_suicune_endpoint_predict_v45_patcher.py

      - name: Apply v4.5 predictor
        run: python3 apply_suicune_endpoint_predict_v45.py

      - name: Verify v4.5 markers
        run: |
          grep -q "ENDPOINT_FAST_TAIL" reader_core/src/crystal/hook.rs
          grep -q "ENDPOINT_FAST_CALLS" reader_core/src/crystal/hook.rs
          grep -q "EP45 +{} S{:04X}" reader_core/src/crystal/trace.rs
          grep -q "EP P R{} DV{:04X}" reader_core/src/crystal/trace.rs
          grep -q "pred_raw" reader_core/src/crystal/trace.rs
          grep -q "ep45_predict" reader_core/src/crystal/trace.rs
          grep -q "fixed_a_frames = 2;" 3gx/sources/main.c
          grep -q "suicune_auto_resume_pending" 3gx/sources/main.c

      - name: Build
        run: make

      - name: Upload Endpoint v4.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Endpoint-Predict-v45-PURETAIL
          retention-days: 7
          path: out/default.3gx
