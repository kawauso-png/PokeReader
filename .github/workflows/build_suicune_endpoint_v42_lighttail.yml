name: Suicune Endpoint Probe v4.2 LIGHTTAIL Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-endpoint-probe-v42-lighttail"

jobs:
  build-endpoint-v42-lighttail:
    name: Build Suicune Endpoint Probe v4.2 LIGHTTAIL
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install endpoint patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3

      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh

      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh

      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh

      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py

      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py

      - name: Verify v4.2 markers
        run: |
          grep -q "struct EndpointSnapshot" reader_core/src/crystal/trace.rs
          grep -q "wrapping_add(13)" reader_core/src/crystal/trace.rs
          grep -q "wrapping_add(11)" reader_core/src/crystal/trace.rs
          grep -q "deep_log_stop();" reader_core/src/crystal/trace.rs
          grep -q "EP42 +{} S{:04X}" reader_core/src/crystal/trace.rs
          grep -q "fixed_a_frames = 2;" 3gx/sources/main.c
          grep -q "suicune_auto_resume_pending" 3gx/sources/main.c

      - name: Build
        run: make

      - name: Upload Endpoint v4.2 LIGHTTAIL artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Endpoint-v42-LIGHTTAIL
          retention-days: 7
          path: out/default.3gx
