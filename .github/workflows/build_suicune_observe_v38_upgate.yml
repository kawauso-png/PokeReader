name: Suicune Observe v3.8 UP Gate Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-observe-v38-upgate"

jobs:
  build-v38-upgate:
    name: Patch and build Suicune Observe v3.8 UP Gate
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply deterministic v3.7 execute patch
        run: sh apply_suicune_deterministic_v37.sh

      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh

      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh

      - name: Apply UP gate
        run: sh apply_suicune_upgate_v38.sh

      - name: Verify v3.8 UP-gate markers
        run: |
          grep -q "suicune_auto_resume_pending" 3gx/sources/main.c
          grep -q "SUICUNE_TICK_BENCH_N 4096" 3gx/sources/main.c
          grep -q "observe_version,fixed_arm_tick" 3gx/sources/main.c
          grep -q "suicune_obs_post_resume_hook_tick" 3gx/sources/main.c
          grep -q "suicune_up_gate_stable" 3gx/sources/main.c
          grep -q "UP-gated v3.8 one-trigger path" 3gx/sources/main.c
          grep -q "if (suicune_up_gate_stable < 3) suicune_up_gate_stable++;" 3gx/sources/main.c
          grep -A3 "static void append_suicune_observe_csv(void)" 3gx/sources/main.c | grep -q "suicune_tick_bench_once();"

      - name: Build
        run: make

      - name: Upload v3.8 UP-gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Observe-v38-UPGate
          retention-days: 7
          path: out/default.3gx
