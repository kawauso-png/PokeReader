name: Suicune Post-Adaptive v6.5 Build

on:
  push:
    branches:
      - suicune-post-adaptive-v65
  workflow_dispatch:

jobs:
  build:
    name: Build Suicune Post-Adaptive v6.5
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh
      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh
      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh
      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py
      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py
      - name: Apply endpoint v4.4 PURETAIL
        run: python3 apply_suicune_endpoint_v44_puretail.py
      - name: Add minimal PURETAIL route counter
        run: python3 apply_suicune_endpoint_v44_routecount.py
      - name: Apply Start Signature v4.8
        run: python3 apply_suicune_start_signature_v48.py
      - name: Apply Resume Phase Lock v4.9
        run: python3 apply_suicune_resume_phase_lock_v49.py
      - name: Fix Start Phase patch match
        run: python3 fix_suicune_start_phase_v50_patch.py
      - name: Apply Start Phase Lock v5.0
        run: python3 apply_suicune_start_phase_lock_v50.py
      - name: Fix v5.2 generated import match
        run: python3 fix_suicune_vblank_context_v52_patch.py
      - name: Apply rolling VBlank Context v5.2
        run: python3 apply_suicune_vblank_context_v52.py
      - name: Freeze VBlank Context after Target
        run: python3 apply_suicune_vblank_context_freeze_v52.py
      - name: Apply scalar VBlank Context v5.3
        run: python3 apply_suicune_vblank_context_v53.py
      - name: Preserve Target Start Signature v5.4
        run: python3 apply_suicune_startsig_preserve_v54.py
      - name: Fix v5.5 generated matches
        run: python3 fix_suicune_early_control_lab_v55_patch.py
      - name: Fix v5.5 detector insertion anchor
        run: python3 fix_suicune_early_control_lab_v55_patch2.py
      - name: Configure detector match behavior
        run: python3 fix_suicune_early_control_lab_v55_patch3.py
      - name: Anchor detector at unique Suicune result check
        run: python3 fix_suicune_early_control_lab_v55_patch4.py
      - name: Apply Early Control Lab v5.5 base
        run: python3 apply_suicune_early_control_lab_v55.py
      - name: Apply v5.6 automatic profiles
        run: python3 apply_suicune_early_profile_v56.py
      - name: Apply v5.7 mapper telemetry
        run: python3 apply_suicune_early_mapper_v57.py
      - name: Apply v5.8 adaptive plumbing
        run: python3 apply_suicune_early_adaptive_v58.py
      - name: Apply v6.0 live phase probe
        run: python3 apply_suicune_live_phase_core_v60.py
      - name: Apply v6.1 neutral-frame actuator
        run: python3 apply_suicune_neutral_delay_v61.py
      - name: Apply v6.1b causal telemetry
        run: python3 apply_suicune_neutral_delay_v61b.py
      - name: Apply v6.1c robust trigger
        run: python3 apply_suicune_neutral_delay_v61c.py
      - name: Apply v6.2 pre-encounter fingerprint
        run: python3 apply_suicune_prefingerprint_v62.py
      - name: Apply v6.3 post-stop1 fingerprint and clean tail
        run: python3 apply_suicune_postfingerprint_v63.py
      - name: Apply v6.4 practical shiny search/path check
        run: python3 apply_suicune_practical_shiny_v64.py
      - name: Apply v6.5 post-adaptive learning fallback
        run: python3 apply_suicune_post_adaptive_v65.py
      - name: Apply v6.5.3 cadence autophase calibration
        run: python3 apply_suicune_cadence_autophase_v653.py
      - name: Verify v6.5 markers
        run: |
          grep -q "S65 LEARN" reader_core/src/crystal/trace.rs
          grep -q "POSTADAPT,V65" reader_core/src/crystal/trace.rs
          grep -q "PRE->POST is not one-to-one" reader_core/src/crystal/trace.rs
          grep -q "calibrate the 16-step DIV cadence" reader_core/src/crystal/trace.rs
          grep -q "PRACTICAL,V64" reader_core/src/crystal/trace.rs
          grep -q "POSTFP,V63" reader_core/src/crystal/trace.rs
      - name: Build
        run: make
      - name: Upload Post-Adaptive v6.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-PostAdaptive-v65
          path: out/default.3gx
          retention-days: 7
