name: Suicune Start Signature v4.8 Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-start-signature-v48"

jobs:
  build-start-signature-v48:
    name: Build Suicune Start Signature v4.8
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3

      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh

      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh

      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh

      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py

      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py

      - name: Apply endpoint v4.4 PURETAIL
        run: python3 apply_suicune_endpoint_v44_puretail.py

      - name: Add minimal PURETAIL route counter
        run: python3 apply_suicune_endpoint_v44_routecount.py

      - name: Apply Start Signature v4.8
        run: python3 apply_suicune_start_signature_v48.py

      - name: Verify v4.8 markers
        run: |
          grep -q "STARTSIG_CPU_CTX_BASE" reader_core/src/crystal/trace.rs
          grep -q "STARTSIG,V48" reader_core/src/crystal/trace.rs
          grep -q "EP48 +{} S{:04X}" reader_core/src/crystal/trace.rs
          grep -q "ENDPOINT_FAST_TAIL" reader_core/src/crystal/hook.rs
          grep -q "fixed_a_frames = 2;" 3gx/sources/main.c
          grep -q "suicune_obs_arm_tick" 3gx/sources/main.c
          grep -q "suicune_auto_resume_pending" 3gx/sources/main.c

      - name: Build
        run: make

      - name: Upload Start Signature v4.8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Start-Signature-v48
          retention-days: 7
          path: out/default.3gx
