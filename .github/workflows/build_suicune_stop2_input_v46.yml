name: Suicune Stop2 Input Probe v4.6 Build

on:
  workflow_dispatch:
  push:
    branches:
      - "suicune-stop2-input-probe-v46"

jobs:
  build-stop2-input-v46:
    name: Build Suicune Stop2 Input Probe v4.6
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install patch dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3

      - name: Apply deterministic v3.7 Exact-2F execute patch
        run: sh apply_suicune_deterministic_v37.sh

      - name: Apply v3.8 clean timing observer
        run: sh apply_suicune_observe_v38.sh

      - name: Keep benchmark out of execution path
        run: sh apply_suicune_observe_v38_post.sh

      - name: Apply endpoint v4.1 detector
        run: python3 apply_suicune_endpoint_v41.py

      - name: Apply endpoint v4.2 light-tail calibration
        run: python3 apply_suicune_endpoint_v42_lighttail.py

      - name: Apply endpoint v4.4 PURETAIL
        run: python3 apply_suicune_endpoint_v44_puretail.py

      # Deliberately DO NOT apply apply_suicune_endpoint_v44_routecount.py.
      # Even a one-byte counter on every 2F60 can add observer cost before the
      # DV calls.  v4.6 needs a truly uninstrumented final Random burst.  The
      # actual raw DV is read from wEnemyMon after it is already locked.

      - name: Apply stop2 input probe v4.6
        run: python3 apply_suicune_stop2_input_v46.py

      - name: Verify v4.6 markers
        run: |
          grep -q "input_stop2_pause_requested" reader_core/src/crystal/trace.rs
          grep -q "input_stop2_resume_repeats" reader_core/src/crystal/trace.rs
          grep -q "input_probe,status" reader_core/src/crystal/trace.rs
          grep -q "S46 +{} S{:04X}" reader_core/src/crystal/trace.rs
          grep -q "EP46 +{} S{:04X}" reader_core/src/crystal/trace.rs
          grep -q "HOLD BASE/UP/A + R" reader_core/src/crystal/trace.rs
          grep -q "ENDPOINT_FAST_TAIL" reader_core/src/crystal/hook.rs
          ! grep -q "ENDPOINT_FAST_CALLS" reader_core/src/crystal/hook.rs
          grep -q "fixed_a_frames = 2;" 3gx/sources/main.c
          grep -q "suicune_auto_resume_pending" 3gx/sources/main.c

      - name: Build
        run: make

      - name: Upload v4.6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-Stop2-Input-v46
          retention-days: 7
          path: out/default.3gx
