name: Suicune v7.10.22 Ordinary DV Calibration
on:
  push:
    branches: [suicune-v7122-calibration]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Generate v7100 baseline
        run: |
          python3 run_suicune_v799_chain_for_v7100.py
          python3 apply_suicune_s1split_selfcal_v7100.py
      - name: Apply observation-only collector
        run: python3 apply_suicune_causal_collector_v7102.py
      - name: Apply ranked PRE experiment
        run: python3 apply_suicune_ranked_hunt_v7108.py
      - name: Verify ranked PRE experiment
        run: python3 verify_suicune_v7108.py
      - name: Apply complete clock collector
        run: python3 apply_suicune_clock_v7110.py
      - name: Verify complete clock collector
        run: python3 verify_suicune_clock_v7110.py
      - name: Apply frozen native state collector
        run: python3 apply_suicune_snapshot_v7111.py
      - name: Verify frozen native state collector
        run: python3 verify_suicune_snapshot_v7111.py
      - name: Apply launch RTC inputs
        run: python3 apply_suicune_rtc_v7112.py
      - name: Verify launch RTC inputs
        run: python3 verify_suicune_rtc_v7112.py
      - name: Verify collector and analysis
        run: python3 verify_suicune_v7102.py
      - name: Apply native shiny candidate gate
        run: python3 apply_suicune_shiny_gate_v7113.py
      - name: Verify native shiny candidate gate
        run: python3 verify_suicune_shiny_gate_v7113.py
      - name: Apply optimized native gate
        run: python3 apply_suicune_fast_gate_v7114.py
      - name: Verify optimized native gate
        run: python3 verify_suicune_fast_gate_v7114.py
      - name: Apply actual DV endpoint
        run: python3 apply_suicune_dv_endpoint_v7115.py
      - name: Verify actual DV endpoint
        run: python3 verify_suicune_dv_endpoint_v7115.py
      - name: Apply guarded fast replay and input snapshot
        run: python3 apply_suicune_fast_snapshot_v7116.py
      - name: Verify guarded fast replay and input snapshot
        run: python3 verify_suicune_fast_snapshot_v7116.py
      - name: Apply broad PRE search
        run: python3 apply_suicune_broad_prefix_v7117.py
      - name: Verify broad PRE search
        run: python3 verify_suicune_broad_prefix_v7117.py
      - name: Apply and verify Mac snapshot export
        run: |
          python3 apply_suicune_mac_snapshot_v7118.py
          python3 verify_suicune_mac_snapshot_v7118.py
      - name: Apply and verify bounded Mac neutral steps
        run: |
          python3 apply_suicune_mac_step_v7119.py
          python3 verify_suicune_mac_step_v7119.py
      - name: Apply and verify absolute-grid control
        run: |
          python3 apply_suicune_mac_control_v7120.py
          python3 verify_suicune_mac_control_v7120.py
      - name: Apply and verify ordinary run and manual step
        run: |
          python3 apply_suicune_manual_v7121.py
          python3 verify_suicune_manual_v7121.py
      - name: Apply and verify ordinary calibration snapshot policy
        run: |
          python3 apply_suicune_calibration_v7122.py
          python3 verify_suicune_calibration_v7122.py
      - name: Build 3GX
        run: make
      - name: Package
        run: |
          mkdir -p v7102-package/generated/3gx/includes v7102-package/generated/reader_core/src/crystal v7102-package/generated/3gx/sources
          cp out/default.3gx v7102-package/default.3gx
          cp reader_core/src/crystal/trace.rs reader_core/src/crystal/hook.rs reader_core/src/crystal/research.rs reader_core/src/crystal/capture_plan.rs reader_core/src/crystal/mod.rs reader_core/src/crystal/clock7110.rs reader_core/src/crystal/snapshot7111.rs reader_core/src/crystal/rtc7112.rs v7102-package/generated/reader_core/src/crystal/
          cp 3gx/sources/main.c 3gx/sources/pnp.c v7102-package/generated/3gx/sources/
          cp 3gx/PokeReader.plgInfo v7102-package/generated/3gx/
          cp -r v7102 v7108 v7110 v7111 v7112 v7113 v7114 v7115 v7116 v7117 v7118_mac v7102-package/
          cp 3gx/sources/v7113_*.c v7102-package/generated/3gx/sources/
          cp 3gx/includes/arm_core.h 3gx/includes/shadow.h 3gx/includes/gate_runtime.h 3gx/includes/dv_endpoint.h v7102-package/generated/3gx/includes/
          cp 3gx/includes/snapshot.h 3gx/includes/const_core.h 3gx/includes/fast_dispatch.h v7102-package/generated/3gx/includes/
          cp 3gx/sources/v7116_snapshot.c v7102-package/generated/3gx/sources/
          cp apply_suicune_fast_snapshot_v7116.py verify_suicune_fast_snapshot_v7116.py v7102-package/
          cp 3gx/includes/prefix.h 3gx/includes/prefix_data.h v7102-package/generated/3gx/includes/
          cp 3gx/sources/v7117_prefix.c v7102-package/generated/3gx/sources/
          cp reader_core/src/crystal/frame.rs v7102-package/generated/reader_core/src/crystal/
          mkdir -p v7102-package/generated/reader_core/src
          cp reader_core/src/lib.rs v7102-package/generated/reader_core/src/
          cp apply_suicune_broad_prefix_v7117.py verify_suicune_broad_prefix_v7117.py v7102-package/
          cp 3gx/Makefile v7102-package/generated/3gx/
          cp apply_suicune_dv_endpoint_v7115.py verify_suicune_dv_endpoint_v7115.py v7102-package/
          cp apply_suicune_fast_gate_v7114.py verify_suicune_fast_gate_v7114.py v7102-package/
          cp apply_suicune_shiny_gate_v7113.py verify_suicune_shiny_gate_v7113.py v7102-package/
          cp apply_suicune_rtc_v7112.py verify_suicune_rtc_v7112.py v7102-package/
          cp apply_suicune_snapshot_v7111.py verify_suicune_snapshot_v7111.py v7102-package/
          cp apply_suicune_clock_v7110.py verify_suicune_clock_v7110.py v7102-package/
          cp apply_suicune_ranked_hunt_v7108.py verify_suicune_v7108.py v7102-package/
          cp apply_suicune_causal_collector_v7102.py analyze_suicune_v7102.py verify_suicune_v7102.py v7102-package/
          cp apply_suicune_mac_snapshot_v7118.py verify_suicune_mac_snapshot_v7118.py v7102-package/
          cp -r v7119_mac v7102-package/
          cp apply_suicune_mac_step_v7119.py verify_suicune_mac_step_v7119.py v7102-package/
          cp 3gx/includes/mac7119_protocol.h v7102-package/generated/3gx/includes/
          cp -r v7120_mac v7102-package/
          cp apply_suicune_mac_control_v7120.py verify_suicune_mac_control_v7120.py v7102-package/
          cp 3gx/includes/mac7120_protocol.h v7102-package/generated/3gx/includes/
          cp -r v7121_manual v7102-package/
          cp apply_suicune_manual_v7121.py verify_suicune_manual_v7121.py v7102-package/
          cp 3gx/includes/manual7121.h v7102-package/generated/3gx/includes/
          cp -r v7122_calibration v7102-package/
          cp apply_suicune_calibration_v7122.py verify_suicune_calibration_v7122.py v7102-package/
          sha256sum out/default.3gx > v7102-package/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v7122-DV-Calibration
          path: v7102-package
          retention-days: 30
