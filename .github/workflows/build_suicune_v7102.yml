name: Suicune v7.10.5 DIV Countdown Probe
on:
  push:
    branches: [suicune-v7105-div-countdown-probe]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Generate v7100 baseline
        run: |
          python3 run_suicune_v799_chain_for_v7100.py
          python3 apply_suicune_s1split_selfcal_v7100.py
      - name: Apply observation-only collector
        run: python3 apply_suicune_causal_collector_v7102.py
      - name: Verify collector and analysis
        run: python3 verify_suicune_v7102.py
      - name: Build 3GX
        run: make
      - name: Package
        run: |
          mkdir -p v7102-package/generated/reader_core/src/crystal v7102-package/generated/3gx/sources
          cp out/default.3gx v7102-package/default.3gx
          cp reader_core/src/crystal/trace.rs reader_core/src/crystal/hook.rs reader_core/src/crystal/research.rs reader_core/src/crystal/capture_plan.rs reader_core/src/crystal/mod.rs v7102-package/generated/reader_core/src/crystal/
          cp 3gx/sources/main.c 3gx/sources/pnp.c v7102-package/generated/3gx/sources/
          cp -r v7102 v7102-package/
          cp apply_suicune_causal_collector_v7102.py analyze_suicune_v7102.py verify_suicune_v7102.py v7102-package/
          sha256sum out/default.3gx > v7102-package/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v7105-Countdown-Probe
          path: v7102-package
          retention-days: 30
