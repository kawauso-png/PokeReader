name: Suicune v7.11.0 Experimental PRE Hunt
on:
  push:
    branches: [suicune-v7110-empirical-pre-hunt]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Generate known v7100 baseline
        run: |
          python3 run_suicune_v799_chain_for_v7100.py
          python3 apply_suicune_s1split_selfcal_v7100.py
      - name: Apply empirical PRE selector
        run: python3 build_v7110.py
      - name: Build experimental 3GX
        run: make
      - name: Package binary and readable generated sources
        run: |
          mkdir -p v7110/source/reader_core/src/crystal v7110/source/3gx/sources
          cp out/default.3gx v7110/PokeReader-Suicune-v7110-EmpiricalPreHunt.3gx
          cp reader_core/src/crystal/{trace.rs,hook.rs,hunt_v7110.rs,hunt_v7110_models.rs} v7110/source/reader_core/src/crystal/
          cp 3gx/sources/main.c v7110/source/3gx/sources/
          cp apply_suicune_v7110.py build_v7110.py hunt_v7110_model.b64 v7110_payload.b64 v7110/source/
          printf '%s\n' 'v7.11.0 EXPERIMENTAL empirical PRE hunt.' 'No physical success-rate claim or device test.' 'Pause, Y+DOWN, release all controls. Scan automatically ranks PRE candidates.' 'Only when S7110 READY: hold physical UP until Exact2 pauses, then release.' 'Keep existing suicune_j_table_v796.bin and calibration files unchanged.' 'All selected attempts run to native final DV. HUNT/HUNTDV CSV fields contain the frozen prediction.' 'No RNG/DIV/DV/save edits. No synthetic UP, Legal Advance or R input.' 'Nearest four of ten whole-path templates, +/-4M transport and +/-1 endpoint SUB model uncertainty.' 'A/r10 root, any bucket; three real neutral frames; FFA4 Exactly2 and M14 preserved.' > v7110/README.txt
          sha256sum v7110/PokeReader-Suicune-v7110-EmpiricalPreHunt.3gx > v7110/SHA256SUMS
          git rev-parse HEAD > v7110/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v7110-EmpiricalPreHunt
          path: v7110
          retention-days: 14
