name: Suicune v7.11.0 Experimental Empirical Hunt

on:
  push:
    branches:
      - suicune-v7110-empirical-hunt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Generate and verify original source chain
        run: python3 run_suicune_v799_chain_for_v7100.py
      - name: Apply v7.10.0 baseline
        run: python3 apply_suicune_s1split_selfcal_v7100.py
      - name: Apply experimental pre-input hunter and test phase tables
        run: python3 apply_suicune_hunt_v7110.py
      - name: Verify input and validation invariants
        run: |
          grep -q 'JOY_HJOYPAD_DOWN' reader_core/src/crystal/hook.rs
          grep -q 'const u32 wanted = 14U' 3gx/sources/main.c
          grep -q 'const V797_FORCE_FINAL_DV_VALIDATION: bool = true;' reader_core/src/crystal/trace.rs
          grep -q 'HUNTDV,V7110' reader_core/src/crystal/trace.rs
          grep -q 'H7110 CANDIDATE' reader_core/src/crystal/trace.rs
          test "$(stat -c %s reader_core/src/crystal/hunt_v7110.bin)" = 332880
      - name: Build ARM11 3GX
        run: make
      - name: Package executable and generated sources
        run: |
          mkdir -p v7110/source/reader_core/src/crystal v7110/source/3gx/sources
          cp out/default.3gx v7110/PokeReader-Suicune-v7110-EmpiricalHunt.3gx
          cp reader_core/src/crystal/trace.rs reader_core/src/crystal/hook.rs reader_core/src/crystal/hunt_v7110.rs reader_core/src/crystal/hunt_v7110.bin v7110/source/reader_core/src/crystal/
          cp 3gx/sources/main.c v7110/source/3gx/sources/
          cp apply_suicune_hunt_v7110.py hunt_v7110.rs hunt_v7110_donors.b85 hunt_v7110_manifest.json v7110/
          printf '%s\n' \
            'EXPERIMENTAL v7.11.0: pre-input workload-adjusted path ensemble.' \
            'Scores are NOT probabilities. Shiny rate and hardware operation are not yet validated.' \
            'Keep the existing /luma/plugins/pokereader/suicune_j_table_v796.bin and calibration files.' \
            'Back up the existing Crystal default.3gx, then replace ONLY that executable.' \
            'At the existing Suicune preparation point: pause, Y+DOWN, release all keys.' \
            'The hunter scans and runs neutral frames automatically. Do not press B or R.' \
            'On H7110 CANDIDATE: physical UP, release after Exact2 auto-pause; M14 resumes automatically.' \
            'Every selected attempt runs to native final DV and saves CSV including frozen HUNTDV predictions.' \
            'No game RNG/DIV/DV/save write or synthetic UP was added.' \
            > v7110/README.txt
          git rev-parse HEAD > v7110/commit.txt
          sha256sum out/default.3gx reader_core/src/crystal/hunt_v7110.bin > v7110/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v7110-EmpiricalHunt
          path: v7110
          retention-days: 14
