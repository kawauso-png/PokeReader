name: Suicune v7.8.0 Practical Rel40 Score Build

on:
  push:
    branches:
      - suicune-v780-practical-rel40-score
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Generate v7.4.4 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/build_suicune_stage3_v744.yml').read_text()
          marker='      - name: Generate Stage3 v7.4.4\n        run: |\n'
          a=s.index(marker)+len(marker)
          b=s.index('      - name: Build v7.4.4',a)
          body=s[a:b]
          Path('/tmp/gen_v744.sh').write_text('\n'.join((x[10:] if x.startswith('          ') else x) for x in body.splitlines())+'\n')
          PY
          sh /tmp/gen_v744.sh
      - name: Apply v7.6.0 weighted selector base
        run: python3 apply_suicune_weighted_root_selector_v760.py
      - name: Apply v7.6.2 multi-PRE inverse selector
        run: python3 apply_suicune_multipre_inverse_v762.py
      - name: Apply v7.6.3 rel40 inverse gate
        run: python3 apply_suicune_rel40_inverse_gate_v763.py
      - name: Apply v7.6.4 rel40 index fallback
        run: python3 apply_suicune_rel40_index_fallback_v764.py
      - name: Apply v7.6.6 phase utility probe
        run: python3 apply_suicune_phase_utility_probe_v766.py
      - name: Apply v7.6.7 live pass base
        run: python3 run_suicune_live_pass_jitter_probe_v767.py
      - name: Apply v7.6.7c exact game-side verification
        run: python3 apply_suicune_live_pass_verify_v767c.py
      - name: Apply v7.6.7d hook-timed verification
        run: python3 apply_suicune_live_pass_verify_v767d.py
      - name: Audit v7.6.7d before no-mask path
        run: python3 audit_suicune_live_pass_v767d.py
      - name: Apply v7.6.7e no-mask baseline
        run: python3 apply_suicune_live_pass_nomask_baseline_v767e.py
      - name: Audit v7.6.7e
        run: python3 audit_suicune_live_pass_v767e.py
      - name: Apply v7.6.7f JP joypad map
        run: python3 apply_suicune_live_pass_joymap_v767f.py
      - name: Audit v7.6.7f
        run: python3 audit_suicune_live_pass_v767f.py
      - name: Apply v7.6.7h closed-loop Exact2
        run: python3 apply_suicune_closed_loop_exact2_v767h.py
      - name: Audit v7.6.7h scope and timing
        run: python3 audit_suicune_live_pass_v767h.py
      - name: Apply v7.6.7i FFA4 Exact2 correction
        run: python3 apply_suicune_closed_loop_exact2_v767i.py
      - name: Audit v7.6.7i low-level Exact2
        run: python3 audit_suicune_live_pass_v767i.py
      - name: Apply v7.6.7j M14 Resume phase lock
        run: python3 apply_suicune_resume_phase_lock_v767j.py
      - name: Audit v7.6.7j before hook-anchor replacement
        run: python3 audit_suicune_resume_phase_lock_v767j.py
      - name: Apply v7.6.7k hook-anchored Resume
        run: python3 apply_suicune_hook_anchored_resume_v767k.py
      - name: Audit v7.6.7k hook anchor and scope
        run: python3 audit_suicune_hook_anchored_resume_v767k.py
      - name: Normalize v7.6.7h rel40 block for v7.8.0
        run: python3 prepare_suicune_rel40_anchor_v780.py
      - name: Apply v7.8.0 observation-only rel40 score probe
        run: python3 apply_suicune_practical_rel40_score_v780.py
      - name: Verify v7.8.0 markers and scope
        run: |
          grep -q "v7.8.0 PRACTICAL REL40 MODAL SCORE" reader_core/src/crystal/practical.rs
          grep -q "fn v780_canonical_raw" reader_core/src/crystal/practical.rs
          grep -q "evaluate_rel40_mode_v780" reader_core/src/crystal/practical.rs
          grep -q "REL40SCORE,V780" reader_core/src/crystal/trace.rs
          grep -q "v7.8.0 EXP: score ACTUAL rel40" reader_core/src/crystal/trace.rs
          grep -q '"HIGH"}else{"OBSERVE"}' reader_core/src/crystal/trace.rs
          grep -q "self.practical_active=false" reader_core/src/crystal/trace.rs
          ! grep -q "practical_fail(14)" reader_core/src/crystal/trace.rs
          grep -q "apply_suicune_hook_anchored_resume_v767k.py" .github/workflows/build_suicune_v780.yml
          ! grep -nE "gb_mem::write|write_u8\(|write_u16\(|rng_state.*=|measured_div.*=" apply_suicune_practical_rel40_score_v780.py
      - name: Build v7.8.0
        run: make
      - name: Package v7.8.0
        run: |
          mkdir -p v780/reader_core/src/crystal v780/reader_core/src/pnp v780/reader_core/src v780/3gx/sources v780/3gx/includes
          cp out/default.3gx v780/PokeReader-Suicune-v780-PracticalRel40Score.3gx
          cp reader_core/src/crystal/practical.rs v780/reader_core/src/crystal/
          cp reader_core/src/crystal/trace.rs v780/reader_core/src/crystal/
          cp reader_core/src/crystal/hook.rs v780/reader_core/src/crystal/
          cp reader_core/src/crystal/mod.rs v780/reader_core/src/crystal/
          cp reader_core/src/lib.rs v780/reader_core/src/
          cp reader_core/src/pnp/bindings.rs v780/reader_core/src/pnp/
          cp reader_core/src/pnp/input.rs v780/reader_core/src/pnp/
          cp 3gx/sources/main.c v780/3gx/sources/
          cp 3gx/sources/hid.c v780/3gx/sources/
          cp 3gx/includes/pokereader.h v780/3gx/includes/
          cp 3gx/includes/hid.h v780/3gx/includes/
          cp apply_suicune_practical_rel40_score_v780.py v780/
          cp prepare_suicune_rel40_anchor_v780.py v780/
          cp apply_suicune_hook_anchored_resume_v767k.py v780/
          sha256sum out/default.3gx > v780/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v780-PracticalRel40Score
          path: v780
          retention-days: 7
