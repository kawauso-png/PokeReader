name: Suicune v7.8.5 Shiny Phase Probe Build

on:
  push:
    branches:
      - suicune-v785-shiny-phase-probe
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3
      - name: Generate v7.4.4 baseline
        run: |
          python3 - <<'PYINNER'
          from pathlib import Path
          s=Path('.github/workflows/build_suicune_stage3_v744.yml').read_text()
          marker='      - name: Generate Stage3 v7.4.4\n        run: |\n'
          a=s.index(marker)+len(marker)
          b=s.index('      - name: Build v7.4.4',a)
          body=s[a:b]
          Path('/tmp/gen_v744.sh').write_text('\n'.join((x[10:] if x.startswith('          ') else x) for x in body.splitlines())+'\n')
          PYINNER
          sh /tmp/gen_v744.sh
      - name: Apply v7.6.0 weighted selector base
        run: python3 apply_suicune_weighted_root_selector_v760.py
      - name: Apply v7.6.2 multi-PRE inverse selector
        run: python3 apply_suicune_multipre_inverse_v762.py
      - name: Apply v7.6.3 rel40 inverse gate
        run: python3 apply_suicune_rel40_inverse_gate_v763.py
      - name: Apply v7.6.4 rel40 index fallback
        run: python3 apply_suicune_rel40_index_fallback_v764.py
      - name: Apply v7.6.6 phase utility probe
        run: python3 apply_suicune_phase_utility_probe_v766.py
      - name: Apply v7.6.7 live pass base
        run: python3 run_suicune_live_pass_jitter_probe_v767.py
      - name: Apply v7.6.7c exact game-side verification
        run: python3 apply_suicune_live_pass_verify_v767c.py
      - name: Apply v7.6.7d hook-timed verification
        run: python3 apply_suicune_live_pass_verify_v767d.py
      - name: Audit v7.6.7d before no-mask path
        run: python3 audit_suicune_live_pass_v767d.py
      - name: Apply v7.6.7e no-mask baseline
        run: python3 apply_suicune_live_pass_nomask_baseline_v767e.py
      - name: Audit v7.6.7e
        run: python3 audit_suicune_live_pass_v767e.py
      - name: Apply v7.6.7f JP joypad map
        run: python3 apply_suicune_live_pass_joymap_v767f.py
      - name: Audit v7.6.7f
        run: python3 audit_suicune_live_pass_v767f.py
      - name: Apply v7.6.7h closed-loop Exact2
        run: python3 apply_suicune_closed_loop_exact2_v767h.py
      - name: Audit v7.6.7h scope and timing
        run: python3 audit_suicune_live_pass_v767h.py
      - name: Apply v7.6.7i FFA4 Exact2 correction
        run: python3 apply_suicune_closed_loop_exact2_v767i.py
      - name: Audit v7.6.7i low-level Exact2
        run: python3 audit_suicune_live_pass_v767i.py
      - name: Apply v7.6.7j M14 Resume phase lock
        run: python3 apply_suicune_resume_phase_lock_v767j.py
      - name: Audit v7.6.7j Resume phase scope
        run: python3 audit_suicune_resume_phase_lock_v767j.py
      - name: Apply v7.8.0 Hybrid Rolling Hunt phase 1
        run: python3 apply_suicune_hybrid_hunt_v780.py
      - name: Apply v7.8.1 Progressive Exact Tail
        run: python3 apply_suicune_progressive_exact_tail_v781.py
      - name: Apply v7.8.2 Rel40 Phase Prefilter
        run: python3 apply_suicune_rel40_phase_prefilter_v782.py
      - name: Apply v7.8.3 PRE Shiny Rolling
        run: python3 apply_suicune_pre_shiny_rolling_v783.py
      - name: Apply v7.8.4 Multi-PRE Rolling
        run: python3 apply_suicune_multipre_rolling_v784.py
      - name: Apply v7.8.5 Shiny Phase Probe
        run: python3 apply_suicune_shiny_phase_probe_v785.py
      - name: Verify v7.8.5 markers
        run: |
          grep -q 'v7.8.5 SHINY-CAPABLE PHASE PROBE' reader_core/src/crystal/trace.rs
          grep -q 'S785 PHASE ROOT READY' reader_core/src/crystal/trace.rs
          grep -q 'PHASEPROBE,V785' reader_core/src/crystal/trace.rs
          grep -q 'practical_live_found_lane == 252' reader_core/src/crystal/trace.rs
          grep -q 'v7.8.5 SHINY PHASE PROBE' 3gx/sources/main.c
          grep -q 'wanted_start = suicune_start_phase_slot' 3gx/sources/main.c
          grep -q 'const u32 wanted = 14U' 3gx/sources/main.c
          grep -q 'JOY_HJOYPAD_DOWN' reader_core/src/crystal/hook.rs
      - name: Build v7.8.5
        run: make
      - name: Package v7.8.5
        run: |
          mkdir -p v785/reader_core/src/crystal v785/3gx/sources
          cp out/default.3gx v785/PokeReader-Suicune-v785-ShinyPhaseProbe.3gx
          cp reader_core/src/crystal/practical.rs v785/reader_core/src/crystal/
          cp reader_core/src/crystal/trace.rs v785/reader_core/src/crystal/
          cp reader_core/src/crystal/hook.rs v785/reader_core/src/crystal/
          cp 3gx/sources/main.c v785/3gx/sources/
          cp apply_suicune_hybrid_hunt_v780.py v785/
          cp apply_suicune_progressive_exact_tail_v781.py v785/
          cp apply_suicune_rel40_phase_prefilter_v782.py v785/
          cp apply_suicune_pre_shiny_rolling_v783.py v785/
          cp apply_suicune_multipre_rolling_v784.py v785/
          cp apply_suicune_shiny_phase_probe_v785.py v785/
          sha256sum out/default.3gx > v785/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v785-ShinyPhaseProbe
          path: v785
          retention-days: 7
