name: Suicune v7.9.6 Mechanistic J Predictor Build

on:
  push:
    branches:
      - suicune-v796-mechanistic-j-predictor
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: zaksabeast/devkitarm-rust
    steps:
      - uses: actions/checkout@v4

      - name: Install dependency
        run: |
          apt-get update --allow-releaseinfo-change
          apt-get install -y python3

      - name: Generate v7.4.4 baseline
        run: |
          python3 - <<'PYINNER'
          from pathlib import Path
          s=Path('.github/workflows/build_suicune_stage3_v744.yml').read_text()
          marker='      - name: Generate Stage3 v7.4.4\n        run: |\n'
          a=s.index(marker)+len(marker)
          b=s.index('      - name: Build v7.4.4',a)
          body=s[a:b]
          Path('/tmp/gen_v744.sh').write_text('\n'.join((x[10:] if x.startswith('          ') else x) for x in body.splitlines())+'\n')
          PYINNER
          sh /tmp/gen_v744.sh

      - name: Apply probe chain through v7.9.2
        run: |
          set -e
          for s in \
            apply_suicune_weighted_root_selector_v760.py \
            apply_suicune_multipre_inverse_v762.py \
            apply_suicune_rel40_inverse_gate_v763.py \
            apply_suicune_rel40_index_fallback_v764.py \
            apply_suicune_phase_utility_probe_v766.py \
            run_suicune_live_pass_jitter_probe_v767.py \
            apply_suicune_live_pass_verify_v767c.py \
            apply_suicune_live_pass_verify_v767d.py \
            apply_suicune_live_pass_nomask_baseline_v767e.py \
            apply_suicune_live_pass_joymap_v767f.py \
            apply_suicune_closed_loop_exact2_v767h.py \
            apply_suicune_closed_loop_exact2_v767i.py \
            apply_suicune_resume_phase_lock_v767j.py \
            apply_suicune_hybrid_hunt_v780.py \
            apply_suicune_progressive_exact_tail_v781.py \
            apply_suicune_rel40_phase_prefilter_v782.py \
            apply_suicune_pre_shiny_rolling_v783.py \
            apply_suicune_multipre_rolling_v784.py \
            apply_suicune_shiny_phase_probe_v785.py \
            normalize_suicune_v786_inputs.py \
            apply_suicune_neutral_phase_probe_v786.py \
            fix_suicune_v786_csv_format.py \
            apply_suicune_stall_pc_probe_v787.py \
            apply_suicune_stall_phase_probe_v788.py \
            apply_suicune_vblank_audio_probe_v789.py \
            apply_suicune_stall_cpuctx_probe_v790.py \
            apply_suicune_trace_slot_fix_v791.py \
            apply_suicune_audio_pre_probe_v792.py
          do
            python3 "$s"
          done

      - name: Verify and materialize v7.9.6 table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct, zlib
          parts=[]
          for i in range(4):
              p=Path(f'suicune_j_table_v796_b64_part{i}.txt')
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              parts.append(p.read_text().strip())
          b=zlib.decompress(base64.b64decode(''.join(parts)))
          if len(b) != 15957*8:
              raise SystemExit(f'bad table length {len(b)}')
          sha=hashlib.sha256(b).hexdigest()
          expected='f68a7fa6d34e17e764b160f7bfea66465dde6703a92cd8affaca1e4c388ee3e4'
          if sha != expected:
              raise SystemExit(f'bad table sha {sha}')
          rows=[struct.unpack_from('<IHH',b,o) for o in range(0,len(b),8)]
          if len({r[0] for r in rows}) != 15957:
              raise SystemExit('duplicate table keys')
          if any(rows[i][0] >= rows[i+1][0] for i in range(len(rows)-1)):
              raise SystemExit('table not strictly sorted')
          print('v796 table OK',len(rows),sha)
          PY

      - name: Apply v7.9.6 mechanistic J predictor
        run: |
          python3 apply_suicune_mechanistic_j_probe_v796.py

      - name: Verify v7.9.6 invariants
        run: |
          test "$(stat -c%s reader_core/src/crystal/suicune_j_table_v796.bin)" = "127656"
          grep -q 'V796_J_TABLE_COUNT: usize = 15957' reader_core/src/crystal/trace.rs
          grep -q 'include_bytes!("suicune_j_table_v796.bin")' reader_core/src/crystal/trace.rs
          grep -q 'fn v796_lookup_cycles' reader_core/src/crystal/trace.rs
          grep -q 'v796_predict_j_from_audiopre' reader_core/src/crystal/trace.rs
          grep -q 'JPRED,V796' reader_core/src/crystal/trace.rs
          grep -Fq 'STALLPHASE,V796,rel0-40+vblankirq+cpuctx84+audiopre+jpred' reader_core/src/crystal/trace.rs
          grep -q 'JOY_HJOYPAD_DOWN' reader_core/src/crystal/hook.rs
          grep -q 'const u32 wanted = 14U' 3gx/sources/main.c
          ! grep -q 'write_u8' apply_suicune_mechanistic_j_probe_v796.py
          ! grep -q 'write_u16' apply_suicune_mechanistic_j_probe_v796.py
          ! grep -q 'Legal Advance' reader_core/src/crystal/trace.rs

      - name: Build v7.9.6
        run: make

      - name: Package v7.9.6
        run: |
          mkdir -p v796/reader_core/src/crystal v796/3gx/sources
          cp out/default.3gx v796/PokeReader-Suicune-v796-MechanisticJ.3gx
          cp reader_core/src/crystal/trace.rs v796/reader_core/src/crystal/
          cp reader_core/src/crystal/hook.rs v796/reader_core/src/crystal/
          cp 3gx/sources/main.c v796/3gx/sources/
          cp apply_suicune_mechanistic_j_probe_v796.py v796/
          cp SUICUNE_V796_MECHANISTIC_J.md v796/
          sha256sum out/default.3gx > v796/sha256.txt
          sha256sum reader_core/src/crystal/suicune_j_table_v796.bin > v796/table_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Suicune-v796-MechanisticJ
          path: v796
          retention-days: 7
