name: Suicune v7.1.3 Empirical Branch Inspection

on:
  push:
    branches:
      - suicune-stage3-v713-multibranch
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode v7.1 empirical lanes
        run: |
          python3 - <<'PY'
          import ast, base64, json, zlib
          from pathlib import Path
          src = Path('apply_suicune_stage3_v710.py').read_text()
          tree = ast.parse(src)
          payload = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'DATA_B85':
                          payload = ast.literal_eval(node.value)
          if payload is None:
              raise SystemExit('DATA_B85 not found')
          lanes = json.loads(zlib.decompress(base64.b85decode(payload)).decode())
          slim = [{k: x[k] for k in ('n','pp','pr','op','or','route')} for x in lanes]
          print('EMP_LANES=' + json.dumps(slim, separators=(',', ':')))
          from collections import Counter
          pre = Counter((x['pp'], x['pr']) for x in lanes)
          post = Counter((x['op'], x['or']) for x in lanes)
          print('PRE_COUNTS=' + json.dumps({f'{k[0]}/r{k[1]}':v for k,v in pre.items()}, sort_keys=True))
          print('POST_COUNTS=' + json.dumps({f'{k[0]}/r{k[1]}':v for k,v in post.items()}, sort_keys=True))
          print('DUP_PRE=' + json.dumps({f'{k[0]}/r{k[1]}':v for k,v in pre.items() if v>1}, sort_keys=True))
          PY
