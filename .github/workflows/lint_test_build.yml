name: Lint, Test, Build

on:
  pull_request:
  push:
    branches:
      - "*"
      - "!main"

jobs:
  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    container: zaksabeast/devkitarm-rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Check Mewtwo analyzer
        run: python3 -m py_compile analyze_mewtwo_microphase.py
      - name: Build
        run: make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeReader-Blue-JP-Mewtwo-RNG-v7.3.1-SafeMarker
          retention-days: 3
          path: out/default.3gx
